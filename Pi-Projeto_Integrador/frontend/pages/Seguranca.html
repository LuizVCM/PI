<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFarr</title>
    <link rel="icon" href="../assets/image/logo.jpeg">
    <link rel="stylesheet" href="../assets/styles/seguranca/all.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
    <header>
        <div class="user"> Lv </div>
        <span class="bem-vindo">Olá, usuário!</span>
    </header>
    <main>
        <aside class="aside">
            <button class="opcao clima"> <i class="fa-solid fa-cloud selecao"></i> Clima </button>
            <button class="opcao gestao"> <i class="fa-brands fa-buffer selecao"></i> Gestão</button>
            <button class="opcao segurancas"> <i class="fa-solid fa-building-shield selecao"></i> Informações </button>
            <button class="opcao sementes"> <i class="fa-solid fa-seedling selecao"></i> Sementes </button>
            <button class="opcao financas"> <i class="fa-solid fa-building-columns selecao"></i> Finanças</button>
            <button class="opcao suporte"> <i class="fa-solid fa-comments-dollar selecao"></i> Suporte </button>
            <button class="opcao relatorio"> <i class="fa-solid fa-envelope-open selecao"></i> Relatório </button>
            <button class="opcao perfil"> <i class="fa-solid fa-circle-user selecao"></i>Perfil </button>


            <button class="navbar"> <i class="fa-solid fa-arrow-right"></i></button>
        </aside>

        <div class="content">
            <div class="info">
                <label for="semente">Selecione aqui a sua planta</label>
                <select name="semente" id="sementeInfo">
                    <option value="Nenhuma planta encontrada">Nenhuma planta encontrada</option>
                    <option value="teste">planta teste</option>
                </select>
                <button type="button" class="acessando"> Acessar</button>
            </div>
        </div>
          
        <!-- Seção onde irá aparecer as informações do momento atual da plantação escolhida -->
            <div class="informations toggle1">
                  <div class="painel">

    <header class="cabecalho">
      <div class="identidade">
        <div class="icone-folha">🌱</div>
        <div>
          <h1 id="nomePlanta">Carregando…</h1>
          <div class="lote" id="numeroLote">lote --</div>
        </div>
      </div>
      <div class="badge-vida">
        Expectativa de vida: <strong id="expectativaVida">--</strong>
      </div>
    </header>

    <section class="hero">
      <div class="cartao cartao-anel">
        <span class="rotulo-topo">Tempo para colheita</span>
        <div class="anel-svg">
          <svg viewBox="0 0 160 160" width="170" height="170">
            <circle cx="80" cy="80" r="68" fill="none" stroke="#eee7d3" stroke-width="14"/>
            <circle id="anelProgresso" cx="80" cy="80" r="68" fill="none"
                    stroke="var(--verde-700)" stroke-width="14" stroke-linecap="round"/>
          </svg>
          <div class="anel-numero">
            <span class="dias" id="diasRestantes">--</span>
            <span class="dias-label">dias restantes</span>
          </div>
        </div>
      </div>

      <div class="cartao cartao-umidade">
        <div>
          <div class="titulo-linha">
            <h2>💧 Umidade do solo</h2>
            <span class="valor-grande" id="valorUmidade">--%</span>
          </div>
          <div class="barra-umidade-trilho">
            <div class="barra-umidade-fill" id="barraUmidade" style="width:0%"></div>
          </div>
          <div class="faixa-umidade">
            <span>seco</span><span>ideal</span><span>encharcado</span>
          </div>
        </div>

        <div class="alerta-rega" id="alertaRega">
          <span class="carregando">verificando necessidade de rega…</span>
        </div>
      </div>
    </section>

    <section class="cartao secao-npk">
      <h2>Nutrientes do solo (NPK)</h2>
      <div class="grade-npk" id="gradeNpk">
        <span class="carregando">carregando níveis de nutrientes…</span>
      </div>
    </section>

    <section class="cartao secao-sugestoes">
      <h2>🌾 Sugestões para esse lote</h2>
      <ul class="lista-sugestoes" id="listaSugestoes">
        <li class="carregando">carregando sugestões…</li>
      </ul>
    </section>

  </div>

            </div>
    </main>

    <script src="../assets/js/home.js"></script>
    <script src="../assets/js/seguranca.js"></script>
</body>

</html>
