<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../assets/styles/home.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
    <header>
        <div class="user"> Lv </div>
        <span class="bem-vindo">Olá, usuário!</span>
    </header>
    <main>
        <aside class="aside">
            <button class="opcao clima"> <i class="fa-solid fa-cloud selecao"></i> Clima </button>
            <button class="opcao gestao"> <i class="fa-brands fa-buffer selecao"></i> Gestão</button>
            <button class="opcao segurancas"> <i class="fa-solid fa-building-shield selecao"></i> Segurança </button>
            <button class="opcao sementes"> <i class="fa-solid fa-seedling selecao"></i> Sementes </button>
            <button class="opcao financas"> <i class="fa-solid fa-building-columns selecao"></i> Finanças</button>
            <button class="opcao suporte"> <i class="fa-solid fa-comments-dollar selecao"></i> Suporte </button>
            <button class="opcao relatorio"> <i class="fa-solid fa-envelope-open selecao"></i> Relatório </button>
            <button class="opcao perfil"> <i class="fa-solid fa-circle-user selecao"></i>Perfil </button>


            <button class="navbar"> <i class="fa-solid fa-arrow-right"></i></button>
        </aside>

        <div class="content">
            <h1 class="title content">Finanças</h1>
            <div class="function novo-registro">
                <button class="function novo registro btn">
                    <h2 class="subtitle content">Registrar nova despesa ou ganho</h2>
                    <i class="fa-solid fa-arrow-right" style="color: rgb(9, 37, 29);"></i>
                </button>
            </div>
            <div class="function despesas-ganhos-mes">
                <button class="function despesas-ganhos-mes btn">
                    <h2 class="subtitle content">Despesas e ganhos do último mês</h2>
                    <i class="fa-solid fa-arrow-right" style="color: rgb(9, 37, 29);"></i>
                </button>
            </div>
            <div class="function despesas-ganhos-ano">
                <button class="function despesas-ganhos-ano btn">
                    <h2 class="subtitle content">Despesas e ganhos do último ano</h2>
                    <i class="fa-solid fa-arrow-right" style="color: rgb(9, 37, 29);"></i>
                </button>
            </div>
            <div class="function grafico-lucro">
                <button class="function grafico-lucro btn">
                    <h2 class="subtitle content">Gerar gráfico de lucro</h2>
                    <i class="fa-solid fa-arrow-right" style="color: rgb(9, 37, 29);"></i>
                </button>
            </div>
        </div>
    </main>

    <script src="../assets/js/home.js"></script>
</body>

</html>
