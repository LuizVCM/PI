        <section class="informacoes-perfil">

          <div class="info-item">
            <span class="info-titulo">EMAIL:</span>
            <span class="info-valor">HAGO-ALINEADO@SENAC.RS.COM</span>
          </div>

          <div class="info-item">
            <span class="info-titulo">LOCALIZAÇÃO:</span>
            <span class="info-valor">Av. no teu coração, 01</span>
          </div>

          <div class="info-item">
            <span class="info-titulo">TELEFONE:</span>
            <span class="info-valor">+55 (51) 9 4002-8922</span>
          </div>

          <div class="info-item">
            <span class="info-titulo">CARGO:</span>
