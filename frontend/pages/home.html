<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraFarr</title>
    <link rel="icon" href="../assets/icon/logo.ico" />
    <link rel="stylesheet" href="../assets/styles/home.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>

  <body>
    <header>
      <button class="btn-menu menu-toggle">
        <i class="fa-solid fa-bars"></i>
      </button>

      <button class="btn-menu menu-mobile">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div class="message-div">
        <span class="bem-vindo" id="welcome-message"></span>
        <div class="user" id="user-abbrev"></div>
      </div>
    </header>
    <div class="overlay"></div>
    <main>
      <aside class="aside">
        <button class="opcao clima">
          <i class="fa-solid fa-cloud selecao"></i> Clima
        </button>
        <button class="opcao gestao">
          <i class="fa-brands fa-buffer selecao"></i> Gestão
        </button>
        <button class="opcao segurancas">
          <i class="fa-solid fa-building-shield selecao"></i> Informações
        </button>
        <button class="opcao sementes">
          <i class="fa-solid fa-seedling selecao"></i> Sementes
        </button>
        <button class="opcao financas">
          <i class="fa-solid fa-building-columns selecao"></i> Finanças
        </button>
        <button class="opcao suporte">
          <i class="fa-solid fa-comments-dollar selecao"></i> Suporte
        </button>
        <button class="opcao relatorio">
          <i class="fa-solid fa-envelope-open selecao"></i> Relatório
        </button>
        <button class="opcao perfil">
          <i class="fa-solid fa-circle-user selecao"></i>Perfil
        </button>
      </aside>

      <div class="content">
        <div class="fundo"></div>
      </div>
    </main>

    <div id="modal-erro" class="modal hidden">
      <div class="modal-overlay" id="modal-erro-overlay"></div>

      <div class="modal-content modal-erro-content">
        <button class="modal-close" id="modal-erro-close">&times;</button>

        <div class="modal-erro-icon">
          <i class="fa-solid fa-circle-exclamation"></i>
        </div>

        <h2 id="modal-erro-title">Ocorreu um erro</h2>

        <p id="modal-erro-message">Não foi possível realizar esta operação.</p>

        <div class="modal-actions">
          <button
            type="button"
            class="btn-action btn-cancelar"
            id="modal-erro-fechar"
          >
            Fechar
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="../assets/js/home.js"></script>
  </body>
</html>
