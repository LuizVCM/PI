<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraFarr – Entrar</title>
    <link rel="icon" href="../assets/images/logo.jpeg" />
    <link rel="stylesheet" href="../assets/styles/formulario.css" />
  </head>

  <body>
    <!-- overlay de entrada -->
    <div class="sobr"></div>

    <!-- fundo desfocado -->
    <div class="background"></div>

    <!-- painel de cadastro -->
    <div class="cadastramento">
      <div class="fundo" id="cadastro-painel">
        <div class="cima">
          <h3>TerraFarr</h3>
          <p>Gerencie sua produção agrícola</p>
          <p>1 de 3 - Cadastre seu usuário</p>
        </div>
        <form class="formulario" id="cadastro">
          <label for="nome-cad">Nome</label>
          <input
            type="text"
            name="nome"
            id="nome-cad"
            placeholder="João"
            autocomplete="given-name"
            required
          />

          <label for="sobrenome-cad">Sobrenome</label>
          <input
            type="text"
            name="sobrenome"
            id="sobrenome-cad"
            placeholder="Silva"
            autocomplete="family-name"
            required
          />

          <label for="email-cad">E-mail</label>
          <input
            type="email"
            name="email"
            id="email-cad"
            placeholder="exemplo@email.com"
            autocomplete="email"
            required
          />

          <label for="telefone-cad">Telefone</label>
          <input
            type="tel"
            name="telefone"
            id="telefone-cad"
            placeholder="(51) 90000-0000"
            autocomplete="tel"
            required
          />

          <label for="cpf-cad">CPF</label>
          <input
            type="text"
            name="cpf"
            id="cpf-cad"
            placeholder="000.000.000-00"
            inputmode="numeric"
            required
          />

          <label for="senha-cad">Senha</label>
          <input
            type="password"
            name="senha"
            id="senha-cad"
            placeholder="Mínimo 6 caracteres"
            required
          />

          <label for="confirmar-senha-cad">Confirmar senha</label>
          <input
            type="password"
            name="confirmar-senha"
            id="confirmar-senha-cad"
            placeholder="Confirmar senha"
            required
          />

          <button type="submit" class="confirmar" id="btn-cadastro">
            Cadastrar
          </button>

          <div class="aglomerado">
            <p>ou</p>
          </div>

          <div class="botoes">
            <button type="button" class="botao">Google</button>
          </div>

          <p>Já possui conta? <a href="#" id="entrar">Entre aqui</a></p>
          <div id="signup-message" class="hidden"></div>
        </form>
      </div>
    </div>

    <!-- cria territorio relacionado aos dados do user -->
    <div class="fundo" id="territorio-painel">
      <div class="cima">
        <h3>2 de 3</h3>
        <p>Cadastre o seu território</p>
      </div>
      <form action="#" class="formulario" id="territorio">
        <label for="cep">Digite o seu CEP</label>
        <input type="text" name="cep" id="cep" placeholder="9000-000" />

        <label for="area">Digite a extensão em número de seu território</label>
        <input type="number" name="area" id="area" placeholder="ex:  6000" />

        <label for="unidade">Escolha a unidade da extensão</label>
        <select
          name="unidade"
          id="unidade"
          placeholder="Escolha uma das opções abaixo"
        >
          <option value="m2">Metros quadrados</option>
          <option value="km2">Quiilômetros quadrados</option>
          <option value="ha">Hectares</option>
        </select>

        <button type="button" class="entrar" id="btnCadastrarTerritorio">
          Cadastrar território
        </button>
      </form>
    </div>

    <!-- cadastrar sensor-->
    <div class="fundo" id="sensor-painel">
      <div class="cima">
        <h3>3 de 3</h3>
        <p>Cadastre seu sensor</p>
      </div>
      <form action="#" class="formulario" id="sensores">
        <label for="tipo">Cadastre a função do sensor</label>
        <select name="tipo" id="tipos">
          <option value="umidade">umidade de solo</option>
          <option value="temperatura">temperatura ambiente e de solo</option>
          <option value="vento">vento e umidade de ambiente</option>
        </select>

        <label for="nomeSensor">Cadastre o nome de sensor</label>
        <input
          type="text"
          name="nomeSensor"
          id="nomeSensor"
          placeholder="Ex: DHT11, BMP280... "
        />

        <button type="button" class="entrar" id="btnCadastrarSensor">
          Cadastrar sensor
        </button>
      </form>
    </div>

    <!-- painel de login -->
    <div class="fundo" id="login-painel">
      <div class="cima">
        <h3>Bem-vindo</h3>
        <p>Acesse suas plantações</p>
      </div>
      <form class="formulario" id="login" novalidate>
        <label for="email-login">E-mail</label>
        <input
          type="email"
          name="email"
          id="email-login"
          placeholder="exemplo@email.com"
          autocomplete="email"
        />

        <label for="senha-login">Senha</label>
        <input
          type="password"
          name="senha"
          id="senha-login"
          placeholder="Digite sua senha"
          autocomplete="current-password"
        />

        <button type="submit" class="entrar">Entrar</button>

        <div class="aglomerado">
          <p>ou</p>
        </div>

        <div class="botoes">
          <button type="button" class="botao">Google</button>
        </div>

        <p>Novo usuário? <a href="#" id="novo-usuario">Comece agora</a></p>
      </form>
    </div>
    <script src="../assets/js/formulario.js"></script>
  </body>
</html>
