<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraFarr – Entrar</title>
    <link rel="icon" href="../assets/icon/logo.ico" />
    <link rel="stylesheet" href="../assets/styles/formulario.css" />
  </head>

  <body>
    <!-- overlay de entrada -->
    <div class="sobr"></div>

    <!-- fundo desfocado -->
    <div class="background"></div>

    <!-- painel de cadastro -->
    <div class="cadastramento">
      <div class="fundo" id="cadastro-painel">
        <div class="cima">
          <h3>TerraFarr</h3>
          <p>Gerencie sua produção agrícola</p>
          <p>Cadastre seu usuário</p>
        </div>
        <form class="formulario" id="cadastro">
          <label for="nome-cad">Nome</label>
          <input
            type="text"
            name="nome"
            id="nome-cad"
            placeholder="João"
            autocomplete="given-name"
            required
          />

          <label for="sobrenome-cad">Sobrenome</label>
          <input
            type="text"
            name="sobrenome"
            id="sobrenome-cad"
            placeholder="Silva"
            autocomplete="family-name"
            required
          />

          <label for="email-cad">E-mail</label>
          <input
            type="email"
            name="email"
            id="email-cad"
            placeholder="exemplo@email.com"
            autocomplete="email"
            required
          />

          <label for="telefone-cad">Telefone</label>
          <input
            type="tel"
            name="telefone"
            id="telefone-cad"
            placeholder="(51) 90000-0000"
            autocomplete="tel"
            required
          />

          <label for="cpf-cad">CPF</label>
          <input
            type="text"
            name="cpf"
            id="cpf-cad"
            placeholder="000.000.000-00"
            inputmode="numeric"
            required
          />

          <label for="senha-cad">Senha</label>
          <input
            type="password"
            name="senha"
            id="senha-cad"
            placeholder="Mínimo 6 caracteres"
            required
          />

          <label for="confirmar-senha-cad">Confirmar senha</label>
          <input
            type="password"
            name="confirmar-senha"
            id="confirmar-senha-cad"
            placeholder="Confirmar senha"
            required
          />

          <button type="submit" class="confirmar" id="btn-cadastro">
            Cadastrar
          </button>

          <p>Já possui conta? <a href="#" id="entrar">Entre aqui</a></p>
          <div id="mensagem-cadastro" class="hidden"></div>
        </form>
      </div>
    </div>

    <!-- cria territorio relacionado aos dados do user -->
    <div class="fundo" id="territorio-painel">
      <div class="cima">
        <h3>Vamos começar</h3>
        <p>1 de 2</p>
        <p>Cadastre o seu território</p>
      </div>
      <form action="#" class="formulario" id="territorio">
        <label for="cep">Digite o seu CEP</label>
        <input type="text" name="cep" id="cep" placeholder="9000-000" />

        <label for="area">Digite a extensão em número de seu território</label>
        <input type="number" name="area" id="area" placeholder="ex: 6000" />

        <label for="unidade">Escolha a unidade da extensão</label>
        <select
          name="unidade"
          id="unidade"
          placeholder="Escolha uma das opções abaixo"
        >
          <option value="m2">Metros quadrados</option>
          <option value="km2">Quiilômetros quadrados</option>
          <option value="ha">Hectares</option>
        </select>

        <button type="submit" class="entrar" id="btn-cadastrar-territorio">
          Cadastrar território
        </button>
        <div id="mensagem-territorio" class="hidden"></div>
      </form>
    </div>

    <!-- cadastrar sensor -->
    <div class="fundo" id="sensor-painel">
      <div class="cima">
        <h3>Vamos começar</h3>
        <p>2 de 2</p>
        <p>Cadastre seu sensor</p>
      </div>
      <form action="#" class="formulario" id="sensores">
        <label for="tipo">Cadastre a função do sensor</label>
        <select name="tipo" id="tipo">
          <option value="umidade do ar">Umidade do ar</option>
          <option value="temperatura do ar">Temperatura do ar</option>
          <option value="umidade do solo">Umidade do solo</option>
          <option value="temperatura do solo">Temperatura do solo</option>
          <option value="pressão">Pressão</option>
        </select>

        <label for="modelo">Cadastre o modelo do sensor</label>
        <input
          type="text"
          name="modelo"
          id="modelo"
          maxlength="100"
          placeholder="Ex: DHT11, BMP280... "
        />

        <button type="submit" class="entrar" id="btn-cadastrar-sensor">
          Cadastrar sensor
        </button>
        <div id="mensagem-sensor" class="hidden"></div>
        <div id="acoes-sensor" class="hidden">
          <p>Cadastrar novamente?</p>
          <div class="btn-acoes">
            <button
              type="button"
              class="btn-action btn-confirmar"
              id="btn-cad-nov"
            >
              Sim
            </button>
            <button
              type="button"
              class="btn-action btn-cancelar"
              id="btn-pular"
            >
              Não
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- painel de login -->
    <div class="fundo" id="login-painel">
      <div class="cima">
        <h3>Bem-vindo</h3>
        <p>Acesse suas plantações</p>
      </div>
      <form class="formulario" id="login" novalidate>
        <label for="email-login">E-mail</label>
        <input
          type="email"
          name="email"
          id="email-login"
          placeholder="exemplo@email.com"
          autocomplete="email"
        />

        <label for="senha-login">Senha</label>
        <input
          type="password"
          name="senha"
          id="senha-login"
          placeholder="Digite sua senha"
          autocomplete="current-password"
        />

        <button type="submit" class="entrar" id="btn-entrar">Entrar</button>

        <p>Novo usuário? <a href="#" id="novo-usuario">Comece agora</a></p>
        <div id="mensagem-login" class="hidden"></div>
      </form>
    </div>
    <script type="module" src="../assets/scripts/pages/formulario.js"></script>
  </body>
</html>
