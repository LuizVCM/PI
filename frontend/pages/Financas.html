<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraFarr – Finanças</title>
    <link rel="icon" href="../assets/images/logo.jpeg" />
    <link rel="stylesheet" href="../assets/styles/financas/all.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>

  <body>
    <header>
      <div class="user">Lv</div>
      <span class="bem-vindo">Olá, usuário!</span>
    </header>
    <main>
      <aside class="aside">
        <button class="opcao clima">
          <i class="fa-solid fa-cloud selecao"></i><span>Clima</span>
        </button>
        <button class="opcao gestao">
          <i class="fa-brands fa-buffer selecao"></i> <span>Gestão</span>
        </button>
        <button class="opcao segurancas">
          <i class="fa-solid fa-building-shield selecao"></i>
          <span>Segurança</span>
        </button>
        <button class="opcao sementes">
          <i class="fa-solid fa-seedling selecao"></i> <span>Sementes</span>
        </button>
        <button class="opcao financas">
          <i class="fa-solid fa-building-columns selecao"></i
          ><span>Finanças</span>
        </button>
        <button class="opcao suporte">
          <i class="fa-solid fa-comments-dollar selecao"></i>
          <span>Suporte</span>
        </button>
        <button class="opcao relatorio">
          <i class="fa-solid fa-envelope-open selecao"></i>
          <span>Relatório</span>
        </button>
        <button class="opcao perfil">
          <i class="fa-solid fa-circle-user selecao"></i><span>Relatório</span>
        </button>
        <button class="navbar"><i class="fa-solid fa-arrow-right"></i></button>
      </aside>

      <div class="content" id="main-content">
        <h1 class="title financas">Finanças</h1>
        <div class="acessos">
          <button class="funcao" id="novo-registro-btn">
            <h2 class="subtitle content">Registrar nova despesa ou ganho</h2>
            <i class="fa-solid fa-plus"></i>
          </button>
          <button class="funcao" id="despesas-ganhos-mes-btn">
            <h2 class="subtitle content">Despesas e ganhos do último mês</h2>
            <i class="fa-regular fa-calendar-days"></i>
          </button>
          <button class="funcao" id="despesas-ganhos-ano-btn">
            <h2 class="subtitle content">Despesas e ganhos do último ano</h2>
            <i class="fa-regular fa-calendar"></i>
          </button>
          <button class="funcao" id="grafico-lucro-btn">
            <h2 class="subtitle content">Gerar gráfico de lucro</h2>
            <i class="fa-solid fa-chart-line"></i>
          </button>
        </div>
      </div>
      <div class="content hidden" id="novo-registro-content">
        <h1 class="title novo-registro">Registrar nova despesa ou ganho</h1>
        <div class="acessos form">
          <form action="" class="form-novo-registro" id="form-novo-registro">
            <div class="top">
              <label for="tipo">Tipo</label>
              <input
                type="list"
                name="tipo"
                id="tipo-registro-financas"
                placeholder="Despesa ou ganho"
              />
              <label for="valor">Valor</label>
              <input
                type="number"
                name="valor"
                id="valor-registro-financas"
                placeholder="Em reais"
              />
            </div>
            <div class="bottom">
            <label for="observacao">Observação</label>
            <input
              type="text"
              name="observacao"
              id="observacao-registro-financas"
              placeholder="Venda, compra ou outro"
            />
            <label for="detalhe">Detalhe</label>
            <input
              type="text"
              name="detalhe"
              id="detalhe-registro-financas"
              placeholder="O que foi vendido / comprado"
            />
        </div>
          </form>
        </div>
      </div>
      <div class="content hidden" id="despesas-ganhos-mes-content">
        <h1 class="title despesas-ganhos-mes">
          Despenhas e ganhos do último mês
        </h1>
        <div class="acessos">
          <div class="grafico" id="graf-despesas-ganhos-mes"></div>
        </div>
      </div>
      <div class="content hidden" id="despesas-ganhos-ano-content">
        <h1 class="title despesas-ganhos-mes">
          Despenhas e ganhos do último ano
        </h1>
        <div class="acessos">
          <div class="grafico" id="graf-despesas-ganhos-ano"></div>
        </div>
      </div>
      <div class="content hidden" id="graf-lucro-content">
        <h1 class="title graf-lucro">Gerar gráfico de lucro</h1>
        <div class="acessos">
          <div class="grafico" id="graf-lucro"></div>
        </div>
      </div>
    </main>

    <script src="../assets/js/home.js"></script>
    <script src="../assets/js/pages/financas.js"></script>
  </body>
</html>
