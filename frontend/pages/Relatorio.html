<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerraFarr - Relatório</title>
  <link rel="icon" href="../assets/icon/logo.ico" />
  <link rel="stylesheet" href="../assets/styles/home.css" />
  <link rel="stylesheet" href="../assets/styles/relatorio/all.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>

<body>
  <header>
    <button class="btn-menu menu-toggle">
      <i class="fa-solid fa-bars"></i>
    </button>

    <button class="btn-menu menu-mobile">
      <i class="fa-solid fa-bars"></i>
    </button>

    <div class="message-div">
      <span class="bem-vindo" id="welcome-message"></span>
      <div class="user" id="user-abbrev"></div>
    </div>
  </header>

  <div class="overlay"></div>

    <main>
      <aside class="aside">
        <button class="opcao clima">
          <i class="fa-solid fa-cloud selecao"></i>
          Clima
        </button>

        <button class="opcao gestao">
          <i class="fa-solid fa-calendar-days selecao"></i>
          Gestão
        </button>

        <button class="opcao segurancas">
          <i class="fa-solid fa-circle-info selecao"></i>
          Informações
        </button>

        <button class="opcao sementes">
          <i class="fa-solid fa-seedling selecao"></i>
          Culturas
        </button>

        <button class="opcao financas">
          <i class="fa-solid fa-coins selecao"></i>
          Finanças
        </button>

        <button class="opcao suporte">
          <i class="fa-solid fa-circle-question selecao"></i>
          Suporte
        </button>

        <button class="opcao relatorio">
          <i class="fa-solid fa-file-lines selecao"></i>
          Relatório
        </button>

        <button class="opcao perfil">
          <i class="fa-solid fa-circle-user selecao"></i>
          Perfil
        </button>
      </aside>

    <div class="content h">
      <div class="infosTotal">
        <div class="infosCima">
          <h1>Relatório Geral</h1>
          <div class="tempo">
            <span class="infoMeses"> {Ano do relatório} </span>
          </div>
        </div>
          <div class="unidades">
            <div class="separacao p">
              <span class="t">Culturas cadastradas</span>
              <div class="numInfos pl">
                <span> 0 </span>
                unidades
              </div>
            </div>
            <div class="separacao l">
              <span class="t">lotes cadastrados</span>
               <div class="numInfos lotesss">
                <span> 0 </span>
                lotes
              </div>
            </div>

          </div>
        <div class="climaSection">
          <div class="analises">
            <canvas id="temp"></canvas>
            <canvas id="vento"></canvas>
            <canvas id="chuva"></canvas>
          </div>
        </div>
      <div class="unidades">
            <div class="separacao p">
              <span class="t">culturas monitoradas</span>
              <div class="numInfos g">
                <span> 0 </span>
                unidades
              </div>
            </div>
            <div class="separacao l">
              <span class="t">sensores cadastrados</span>
               <div class="numInfos sensores">
                <span> 0 </span>
                sensores
              </div>
            </div>

          </div>

      </div>
    </div>
  </main>

  <script type="module" src="../assets/js/home.js"></script>
  <script type="module" src="../assets/js/apis.js"></script>
  <script src="../assets/js/relatorio/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../assets/js/relatorio/graficos.js"></script>
</body>

</html>
