<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TerraFarr - Informações</title>
  <link rel="icon" href="../assets/icon/logo.ico" />
  <link rel="stylesheet" href="../assets/styles/seguranca/all.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/apexcharts/3.45.1/apexcharts.min.js"></script>
</head>

<body>
  <header>
    <button class="btn-menu menu-toggle">
      <i class="fa-solid fa-bars"></i>
    </button>

    <button class="btn-menu menu-mobile">
      <i class="fa-solid fa-bars"></i>
    </button>

    <div class="message-div">
      <span class="bem-vindo" id="welcome-message"></span>
      <div class="user" id="user-abbrev"></div>
    </div>
  </header>

  <div class="overlay"></div>

  <main>
    <aside class="aside">
      <button class="opcao clima">
        <i class="fa-solid fa-cloud selecao"></i>
        Clima
      </button>

      <button class="opcao gestao">
        <i class="fa-solid fa-calendar-days selecao"></i>
        Gestão
      </button>

      <button class="opcao segurancas">
        <i class="fa-solid fa-circle-info selecao"></i>
        Informações
      </button>

      <button class="opcao sementes">
        <i class="fa-solid fa-seedling selecao"></i>
        Culturas
      </button>

      <button class="opcao financas">
        <i class="fa-solid fa-coins selecao"></i>
        Finanças
      </button>

      <button class="opcao suporte">
        <i class="fa-solid fa-circle-question selecao"></i>
        Suporte
      </button>

      <button class="opcao relatorio">
        <i class="fa-solid fa-file-lines selecao"></i>
        Relatório
      </button>

      <button class="opcao perfil">
        <i class="fa-solid fa-circle-user selecao"></i>
        Perfil
      </button>
    </aside>

    <div class="content i">
      <section class="info">
        <label for="semente">Selecione aqui a sua planta</label>
        <select name="semente" id="sementeInfo"class="plantas">
          <option value="Nenhuma planta encontrada" >
            Nenhuma planta encontrada
          </option>
          <option value="teste">planta teste</option>
        </select>
        <button type="button" class="acessando btn-action">Acessar</button>
      </div>
    </div>

    <!-- Seção onde irá aparecer as informações do momento atual da plantação escolhida -->
    <div class="informations toggle1">
      <div class="botao">
        <button class="btn-voltar" id="btnVoltarAgenda">
          <i class="fa-solid fa-arrow-left"></i>
          Voltar
        </button>
      </div>
      <div class="painel">
        <header class="cabecalho">
          <div class="identidade">
            <div class="icone-folha">🌱</div>
            <div class="loteIdent">
              <h1 id="nomePlanta">Carregando…</h1>
              <div class="lote" id="numeroLote">fornecedor --</div>
            </div>
          </div>
          <div class="badge-vida">
            Expectativa de vida: <strong id="expectativaVida">--</strong>
          </div>
        </header>

        <section class="hero">
          <div id="chart"></div>

          <div class="cartao cartao-umidade">
            <div>
              <div class="titulo-linha">
                <h2>💧 Umidade do solo</h2>
                <span class="valor-grande" id="valorUmidade">--%</span>
              </div>
              <div class="barra-umidade-trilho">
                <div class="barra-umidade-fill" id="barraUmidade" style="width: 0%"></div>
              </div>
              <div class="faixa-umidade">
                <span>seco</span><span>ideal</span><span>encharcado</span>
              </div>
            </div>

            <div class="alerta-rega" id="alertaRega">
              <span class="carregando">verificando necessidade de rega…</span>
            </div>
          </div>
        </section>

        <section class="cartao secao-npk">
          <h2>Nutrientes do solo (NPK)</h2>
          <div class="grade-npk" id="gradeNpk">
            <span class="carregando">carregando níveis de nutrientes…</span>
          </div>
        </section>

        <section class="cartao secao-sugestoes">
          <h2>🌾 observações para esse plantio</h2>
          <ul class="lista-sugestoes" id="listaSugestoes">
            <li class="carregando">carregando sugestões…</li>
          </ul>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="../assets/js/home.js"></script>
  <script type="module" src="../assets/js/seguranca.js"></script>

  <script type="module" src="../assets/js/informação/gráficoUmidade.js"></script>
  <script type="module" src="../assets/js/informação/api.js"></script>
  <script type="module" src="../assets/js/Cálculos.js"></script> 
   <script type="module" src="../assets/js/chart.js"></script>
</body>

</html>
