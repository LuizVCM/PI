<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraFarr - Perfil</title>
    <link rel="icon" href="../assets/icon/logo.ico" />
    <link rel="stylesheet" href="../assets/styles/Perfil/all.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>

  <body>
    <header>
      <button class="btn-menu menu-toggle">
        <i class="fa-solid fa-bars"></i>
      </button>

      <button class="btn-menu menu-mobile">
        <i class="fa-solid fa-bars"></i>
      </button>

      <div class="message-div">
        <span class="bem-vindo" id="welcome-message"></span>
        <div class="user" id="user-abbrev"></div>
      </div>
    </header>

    <div class="overlay"></div>

    <main>
      <aside class="aside">
        <button class="opcao clima">
          <i class="fa-solid fa-cloud selecao"></i>
          Clima
        </button>

        <button class="opcao gestao">
          <i class="fa-solid fa-calendar-days selecao"></i>
          Gestão
        </button>

        <button class="opcao segurancas">
          <i class="fa-solid fa-circle-info selecao"></i>
          Informações
        </button>

        <button class="opcao sementes">
          <i class="fa-solid fa-seedling selecao"></i>
          Culturas
        </button>

        <button class="opcao financas">
          <i class="fa-solid fa-coins selecao"></i>
          Finanças
        </button>

        <button class="opcao suporte">
          <i class="fa-solid fa-circle-question selecao"></i>
          Suporte
        </button>

        <button class="opcao relatorio">
          <i class="fa-solid fa-file-lines selecao"></i>
          Relatório
        </button>

        <button class="opcao perfil">
          <i class="fa-solid fa-circle-user selecao"></i>
          Perfil
        </button>
      </aside>

      <div class="content q">
        <section class="cabecalho-perfil">
          <div class="foto-usuario"></div>

          <div class="dados-usuario">
            <h1 class="nome-usuario"></h1>
          </div>
        </section>
         
        <section class="informacoes-perfil">
          <div class="btns">
           <div class="perfil">
             <button type="button" class="btn-salvar b">editar perfil</button>
 
          <button type="button" class="btn-salvar b">excluir perfil</button>

           </div>
           
         </div>
          <h2 class="titulo-secao">Informações do Perfil</h2>

          <div class="info-item">
            <span class="info-titulo">E-mail:</span>
            <span class="info-valor email"></span>
          </div>

          <div class="info-item">
            <span class="info-titulo">Localização:</span>
           
            <span class="info-valor localizacao"></span> 
           <div class="botoes">
             <button class="btn-editar">
              <i class="fa-solid fa-pen"></i>
            </button>
             <button class="btn-excluir ">
              <i class="fa-solid fa-trash-can"></i>
             </button>
           </div>
          </div>

          <div class="info-item">
            <span class="info-titulo">Telefone:</span>
            <span class="info-valor telefone"></span>
          </div>

          <div class="info-item">
            <span class="info-titulo">CPF:</span>
            <span class="info-valor cpf"></span>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="../assets/js/home.js"></script>
    <script type="module" src="../assets/js/pages/perfil.js"></script>
  </body>
</html>
