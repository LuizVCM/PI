<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraFarr</title>
    <link rel="icon" href="../assets/images/logo.jpeg" />
    <link rel="stylesheet" href="./assets/styles/index.css" />
    <!-- importação de biblioteca de animações-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body>
    <!-- container principal com perspectiva -->
    <div class="container">
      <!-- card que vai girar -->
      <div class="card">
        <!-- frente do card (GIF) -->
        <div class="flip-card-front"></div>
        <!-- verso do card (logo) -->
        <div class="flip-card-back"></div>
      </div>
    </div>
    <script>
      // função para abrir a página 'formulario.html' após 3,2 segundos
      function abrirFormulario() {
        setTimeout(function () {
          // redireciona para a página 'formulario.html' na mesma pasta
          window.location.href = "formulario.html";
        }, 3200);
      }
      // executa quando a página carregar
      window.onload = abrirFormulario;
    </script>
  </body>
</html>
