<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraFarr – Entrar</title>
    <link rel="stylesheet" href="assets/styles/formulario.css" />
  </head>

  <body>
    <!-- overlay de entrada -->
    <div class="sobr"></div>

    <!-- fundo desfocado -->
    <div class="background"></div>

    <!-- painel de cadastro (oculto por padrão via classe .cadastro no CSS) -->
    <div class="cadastramento">
      <div class="fundo cadastro tamanho">
        <div class="cima">
          <h3>TerraFarr</h3>
          <p>Gerencie sua produção agrícola</p>
        </div>
        <form class="formulario" id="cadastro" novalidate>
          <label for="nome-cad">Nome</label>
          <input
            type="text"
            name="nome"
            id="nome-cad"
            placeholder="João"
            autocomplete="given-name"
          />

          <label for="sobrenome-cad">Sobrenome</label>
          <input
            type="text"
            name="sobrenome"
            id="sobrenome-cad"
            placeholder="Silva"
            autocomplete="family-name"
          />

          <label for="email-cad">E-mail</label>
          <input
            type="email"
            name="email"
            id="email-cad"
            placeholder="exemplo@email.com"
            autocomplete="email"
          />

          <label for="telefone-cad">Telefone</label>
          <input
            type="tel"
            name="telefone"
            id="telefone-cad"
            placeholder="(51) 90000-0000"
            autocomplete="tel"
          />

          <label for="cpf-cad">CPF</label>
          <input
            type="text"
            name="cpf"
            id="cpf-cad"
            placeholder="000.000.000-00"
            inputmode="numeric"
          />

          <label for="senha-cad">Senha</label>
          <input
            type="password"
            name="senha"
            id="senha-cad"
            placeholder="Mínimo 6 caracteres"
            autocomplete="new-password"
          />

          <button type="submit" class="confirmar">Cadastrar</button>

          <div class="aglomerado">
            <p>ou</p>
          </div>

          <div class="botoes">
            <button type="button" class="botao">Google</button>
          </div>

          <p>Já possui conta? <a href="#" id="entra2">Entre aqui</a></p>
        </form>
      </div>
    </div>

    <!-- painel de login (visível por padrão) -->
    <div class="fundo">
      <div class="cima">
        <h3>Bem-vindo</h3>
        <p>Acesse sua plantação</p>
      </div>
      <form class="formulario" id="login" novalidate>
        <label for="email-login">E-mail</label>
        <input
          type="email"
          name="email"
          id="email-login"
          placeholder="exemplo@email.com"
          autocomplete="email"
        />

        <label for="senha-login">Senha</label>
        <input
          type="password"
          name="senha"
          id="senha-login"
          placeholder="Digite sua senha"
          autocomplete="current-password"
        />

        <button
          type="button"
          class="entrar"
          onclick="window.location.href = 'home.html'"
        >
          Entrar
        </button>

        <div class="aglomerado">
          <p>ou</p>
        </div>

        <div class="botoes">
          <button type="button" class="botao">Google</button>
        </div>

        <p>Novo usuário? <a href="#" id="paragrafoLink">Comece agora</a></p>
      </form>
    </div>

    <script src="assets/js/formulario.js"></script>
  </body>
</html>
